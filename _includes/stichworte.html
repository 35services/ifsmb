{%- assign st = include.tags -%}
{%- if st and st.size > 0 -%}
<ul class="tag-list">
  {%- for t in st %}
  <li>{% ifpage /tags/ %}<a href="{{ '/tags/' | relative_url }}#{{ t }}">#{{ site.data.tags[t] | default: t }}</a>{% endifpage %}{% unlesspage /tags/ %}#{{ site.data.tags[t] | default: t }}{% endunlesspage %}</li>
  {%- endfor %}
</ul>
{%- endif -%}
