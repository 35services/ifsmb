title: 35 services e. V.
short_title: IfsMB
description: Wir bauen Makespaces – spontan, gemeinsam und dort, wo Kinder und Jugendliche lernen.
baseurl: ""
url: "https://35services.ifsmb.de"
lang: de
timezone: Europe/Berlin
future: true

# Look of the site (_data/themes.yml): default for every page without `theme:` – not `theme:`, Jekyll uses that for gem themes
default_theme: slop

# Bearbeiten-Button (_layouts/default.html)
repository: 35services/ifsmb
branch: main

# Connected instances (federation): other sites built from this code base. /network/ and /search/ include their
# data only after a click ("?verbund=1"); listed in /meta_graph.json. Base URLs without a trailing slash.
federation:
  - https://ifsmb.de

# Local dev server only (jekyll serve): allow other local instances to read the JSON files, like GitHub Pages does
# (access-control-allow-origin: *) – needed to test federation between two local servers (e.g. ports 4001 and 4003).
webrick:
  headers:
    Access-Control-Allow-Origin: "*"

markdown: kramdown
permalink: /news/:year/:month/:day/:title/

collections:
  team:
    output: true
    permalink: /team/:name/
  projects:
    output: true
    permalink: /projects/:name/
  events:
    output: true
    permalink: /calendar/:name/
  press:
    output: true
    permalink: /press/:slug/
  equipment:
    output: true
    permalink: /equipment/:name/
  challenges:
    output: true
    permalink: /challenges/:name/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "team"
    values:
      layout: "member"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "events"
    values:
      layout: "event"
  - scope:
      path: ""
      type: "press"
    values:
      layout: "press"
  - scope:
      path: ""
      type: "equipment"
    values:
      layout: "equipment"
  - scope:
      path: ""
      type: "challenges"
    values:
      layout: "herausforderung"

# Navigation: `key` = UI string in _data/i18n/*.yml (English/French in the browser, assets/js/i18n.js)
nav:
  - title: Neuigkeiten
    key: nav.news
    url: /news/
  - title: Kalender
    key: nav.calendar
    url: /calendar/
  - title: Team
    key: nav.team
    url: /team/
  - title: Ausstattung
    key: nav.equipment
    url: /equipment/
  - title: Netzwerk
    key: nav.network
    url: /network/

# Pagefind-Index (_site/pagefind/) beim Neubauen nicht löschen – lokal mit `npx pagefind --site _site` erzeugt
keep_files:
  - pagefind

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - CLAUDE.md
  - CHANGELOG.md
  - DATA_STRUCTURES.md
  - DEPENDENCIES.md
  - PLAN_DIRECT_EDITING.md
  - EDITING_CONFLICTS.md
  - LICENSE
  - .pages.yml
  - todo.md
