title: Institut für spontane Makespace Buildung
short_title: IfsMB
description: Wir bauen Makespaces – spontan, gemeinsam und dort, wo Kinder und Jugendliche lernen.
baseurl: ""
url: "https://ifsmb.de"
lang: de
timezone: Europe/Berlin
future: true

# Look of the site (_data/themes.yml): default for every page without `theme:` – not `theme:`, Jekyll uses that for gem themes
# default_theme: ifsmb

# Bearbeiten-Button (_layouts/default.html)
repository: falkorichter/ifsmb.de
branch: main

markdown: kramdown
permalink: /news/:year/:month/:day/:title/

collections:
  team:
    output: true
    permalink: /team/:name/
  projects:
    output: true
    permalink: /projekte/:name/
  events:
    output: true
    permalink: /kalender/:name/
  press:
    output: true
    permalink: /presse/:slug/
  equipment:
    output: true
    permalink: /ausstattung/:name/
  herausforderungen:
    output: true
    permalink: /herausforderungen/:name/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "team"
    values:
      layout: "member"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "events"
    values:
      layout: "event"
  - scope:
      path: ""
      type: "press"
    values:
      layout: "press"
  - scope:
      path: ""
      type: "equipment"
    values:
      layout: "equipment"
  - scope:
      path: ""
      type: "herausforderungen"
    values:
      layout: "herausforderung"

# Navigation: `key` = UI string in _data/i18n/*.yml (English/French in the browser, assets/js/i18n.js)
nav:
  - title: Neuigkeiten
    key: nav.news
    url: /news/
  - title: Kalender
    key: nav.calendar
    url: /kalender/
  - title: Wir
    key: nav.about_us
    children:
      - title: Netzwerk
        key: nav.network
        url: /netzwerk/
      - title: Karte
        key: nav.map
        url: /karte/
      - title: Projekte
        key: nav.projects
        url: /projekte/
      - title: Projekt-Ideen
        key: nav.project_ideas
        url: /projekte/ideen/
      - title: Herausforderungen
        key: nav.challenges
        url: /herausforderungen/
      - title: Angebot
        key: nav.offer
        url: /angebot/
      - title: Geld für Makespaces
        key: nav.funding
        url: /geld-fuer-makespaces/
      - title: Ausstattung
        key: nav.equipment
        url: /ausstattung/
      - title: Team
        key: nav.team
        url: /team/
  - title: Partner
    key: nav.partners
    url: /partner/
  - title: Presse
    key: nav.press
    url: /presse/
  - title: Suche
    key: nav.search
    url: /suche/

# Pagefind-Index (_site/pagefind/) beim Neubauen nicht löschen – lokal mit `npx pagefind --site _site` erzeugt
keep_files:
  - pagefind

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - CLAUDE.md
  - CHANGELOG.md
  - DATA_STRUCTURES.md
  - DEPENDENCIES.md
  - PLAN_DIRECT_EDITING.md
  - EDITING_CONFLICTS.md
  - LICENSE
  - .pages.yml
  - todo.md
