short_profile: >-
  Das Institut für spontane Makespace Buildung (IfsMB) richtet gemeinsam mit Schulen,
  Vereinen und offenen Werkstätten in Berlin-Moabit Makespaces ein: Orte, an denen Kinder
  und Jugendliche löten, programmieren, 3D-drucken und Dinge selbst bauen können.
  Das Institut arbeitet ehrenamtlich und ohne lange Anträge – mit dem, was gerade da ist.
